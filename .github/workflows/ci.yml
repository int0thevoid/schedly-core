name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test @schedly/ui
        run: cd packages/ui && pnpm test

      - name: Test @schedly/notifications
        run: cd packages/notifications && pnpm test

      - name: Generate Prisma Client
        run: cd packages/booking && npx prisma generate

      - name: Test @schedly/booking
        run: cd packages/booking && pnpm test
